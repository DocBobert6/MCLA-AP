name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Find and make gradlew executable
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f -not -path "*/.*" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew wrapper not found in repository!"
            exit 1
          fi
          echo "Found gradlew at: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"

      - name: Build Release APK with Gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f -not -path "*/.*" | head -n 1)
          DIR=$(dirname "$GRADLEW_PATH")
          echo "Building from directory: $DIR"
          cd "$DIR"
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCLA-AP-Release-APK
          path: |
            **/build/outputs/apk/release/*.apk
