name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: Generate Gradle Wrapper if Missing
        run: |
          if [ ! -f "./gradlew" ] && [ ! -f "android/gradlew" ]; then
            BUILD_GRADLE=$(find . -name "build.gradle" -o -name "build.gradle.kts" -not -path "*/.*" | head -n 1)
            if [ -n "$BUILD_GRADLE" ]; then
              DIR=$(dirname "$BUILD_GRADLE")
              echo "Generating gradlew in $DIR..."
              cd "$DIR"
              gradle wrapper
            else
              echo "Error: No build.gradle found in repository!"
              exit 1
            fi
          fi

      - name: Build Release APK with Gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f -not -path "*/.*" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew wrapper could not be found or generated."
            exit 1
          fi
          DIR=$(dirname "$GRADLEW_PATH")
          echo "Building from directory: $DIR"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCLA-AP-Release-APK
          path: |
            **/build/outputs/apk/release/*.apk
