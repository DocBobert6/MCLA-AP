name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: true

env:
  APP_ID: com.docbobert6.mclaap
  APP_NAME: MCLA Toolchain

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web app
        run: bun run build

      - name: Add Capacitor
        run: bun add @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "dist"
          }
          EOF

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Set version
        run: |
          sed -i -E "s/(versionCode[ =]+)[0-9]+/\1${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/(versionName[ =]+)\"[^\"]*\"/\1\"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/MCLA-AP.apk
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCLA-AP-apk
          path: out/MCLA-AP.apk
          if-no-files-found: error

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/MCLA-AP.apk \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Debug APK built from ${{ github.sha }}" \
            --target "${{ github.sha }}" \
            --prerelease
