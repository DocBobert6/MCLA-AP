name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inspect Repository Structure
        run: |
          echo "=== Top-level files ==="
          ls -la
          echo "=== Searching for build files ==="
          find . -maxdepth 3 -name "*.gradle" -o -name "*.kts" -o -name "CMakeLists.txt" -o -name "Makefile" -o -name "*.sh"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Detected System
        run: |
          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ] || [ -f "android/build.gradle" ]; then
            echo "Detected Gradle project..."
            GRADLEW=$(find . -name "gradlew" -type f | head -n 1)
            if [ -n "$GRADLEW" ]; then
              chmod +x "$GRADLEW"
              cd "$(dirname "$GRADLEW")"
              ./gradlew assembleRelease
            else
              gradle assembleRelease
            fi
          elif [ -f "CMakeLists.txt" ] || [ -f "jni/CMakeLists.txt" ]; then
            echo "Detected CMake native project..."
            # Configure and build native components via Android SDK/NDK cmake
            export ANDROID_NDK_HOME=$ANDROID_SDK_PATH/ndk/latest
            mkdir -p build && cd build
            cmake .. -DANDROID_ABI=arm64-v8a -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
            make -j$(nproc)
          else
            echo "Looking for custom build scripts..."
            BUILD_SCRIPT=$(find . -maxdepth 2 -name "build*.sh" -o -name "make*.sh" | head -n 1)
            if [ -n "$BUILD_SCRIPT" ]; then
              chmod +x "$BUILD_SCRIPT"
              ./"$BUILD_SCRIPT"
            else
              echo "Error: Could not automatically determine build system."
              exit 1
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCLA-AP-Release-APK
          path: |
            **/build/outputs/apk/release/*.apk
            **/*.apk
