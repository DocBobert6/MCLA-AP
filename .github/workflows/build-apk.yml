name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Repository Diagnostic & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: List All Repository Files
        run: |
          echo "=========================================="
          echo "COMPLETE REPOSITORY FILE TREE:"
          echo "=========================================="
          find . -maxdepth 4 -not -path '*/.*' | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Attempt Build Based on Discovered Files
        run: |
          echo "Scanning for build configurations..."
          
          # Check for Android/Gradle files anywhere
          GRADLE_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" -not -path "*/.*" | head -n 1)
          # Check for shell build scripts
          BUILD_SH=$(find . -name "*.sh" -not -path "*/.*" | head -n 1)
          # Check for makefiles or other build descriptors
          MAKEFILE=$(find . -name "Makefile" -o -name "makefile" -not -path "*/.*" | head -n 1)

          if [ -n "$GRADLE_FILE" ]; then
            DIR=$(dirname "$GRADLE_FILE")
            echo "Found Gradle project in: $DIR"
            cd "$DIR"
            if [ -f "gradlew" ]; then
              chmod +x gradlew
              ./gradlew assembleRelease
            else
              gradle assembleRelease
            fi
          elif [ -n "$BUILD_SH" ]; then
            DIR=$(dirname "$BUILD_SH")
            echo "Found shell build script in: $DIR"
            cd "$DIR"
            chmod +x "$(basename "$BUILD_SH")"
            ./"$(basename "$BUILD_SH")"
          elif [ -n "$MAKEFILE" ]; then
            DIR=$(dirname "$MAKEFILE")
            echo "Found Makefile in: $DIR"
            cd "$DIR"
            make
          else
            echo "No standard build file automatically recognized."
            echo "Review the file tree printed above to identify the source layout."
            exit 1
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MCLA-AP-Build-Output
          path: |
            **/build/outputs/apk/**/*.apk
            **/*.apk
            **/*.so
            **/bin/*
