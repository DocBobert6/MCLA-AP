name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native CMake Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate CMakeLists.txt and Build with NDK
        run: |
          echo "Locating CMakeLists.txt..."
          CMAKE_FILE=$(find . -name "CMakeLists.txt" -not -path "*/.*" | head -n 1)
          
          if [ -z "$CMAKE_FILE" ]; then
            echo "Error: CMakeLists.txt not found anywhere in the repository!"
            exit 1
          fi
          
          DIR=$(dirname "$CMAKE_FILE")
          echo "Found CMake project in: $DIR"
          
          # Locate the runner's preinstalled Android NDK
          export ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* | head -n 1)
          echo "Using Android NDK at: $ANDROID_NDK_HOME"
          
          cd "$DIR"
          mkdir -p build-android
          cd build-android
          
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
            
          cmake --build . --config Release -j$(nproc)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MCLA-AP-Build-Output
          path: |
            **/build/**/*.so
            **/build-android/**/*.so
            **/build/outputs/apk/**/*.apk
            **/*.apk
            **/*.so
